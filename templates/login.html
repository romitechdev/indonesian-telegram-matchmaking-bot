<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Dashboard LoveMatchID</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --border: #243244;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .notice {
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 8px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1220;
      color: var(--text);
      padding: 9px 10px;
      font-size: 14px;
    }

    button {
      margin-top: 4px;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      background: #1d4ed8;
      color: #fff;
      padding: 9px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Login Dashboard</h1>
    <p class="sub">Masuk pakai username dan password admin.</p>

    {% if error_message %}
      <div class="notice">{{ error_message }}</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_value }}">

      <label for="username">Username</label>
      <input id="username" type="text" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>

      <button type="submit">Masuk</button>
    </form>
  </div>
</body>
</html>
